<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
  }

  body {
    background: #000;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }

  #scene-wrap {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    position: relative;
    overflow: hidden;
    background: #000;
  }

  .scene {
    width: 100%;
    height: 100%;
    position: relative;
    background: #030305;
    overflow: hidden;
  }

  /* ===== CINEMATIC CAMERA DRIFT ===== */
  .camera {
    position: absolute;
    inset: -6%;
    animation: cameraDrift 22s ease-in-out infinite alternate;
    filter: saturate(1.12) contrast(1.08);
  }
  @keyframes cameraDrift {
    0%   { transform: scale(1.06) translate(1%, 0.5%); }
    50%  { transform: scale(1.1) translate(-1%, -1%); }
    100% { transform: scale(1.04) translate(0.5%, 1%); }
  }

  /* ===== LETTERBOX BARS ===== */
  .letterbox-top, .letterbox-bottom {
    position: absolute;
    left: 0; right: 0;
    height: 6.5%;
    background: #000;
    z-index: 30;
  }
  .letterbox-top { top: 0; }
  .letterbox-bottom { bottom: 0; }

  /* ===== FILM GRAIN ===== */
  .grain {
    position: absolute;
    inset: 0;
    z-index: 25;
    pointer-events: none;
    opacity: 0.07;
    mix-blend-mode: overlay;
    background-image:
      repeating-conic-gradient(from 0deg, #fff 0deg 0.3deg, transparent 0.3deg 1deg);
    animation: grainShift 0.4s steps(4) infinite;
  }
  @keyframes grainShift {
    0%   { transform: translate(0,0); }
    25%  { transform: translate(-1%,1%); }
    50%  { transform: translate(1%,-1%); }
    75%  { transform: translate(-1%,-1%); }
    100% { transform: translate(1%,1%); }
  }

  /* ===== VIGNETTE ===== */
  .vignette {
    position: absolute;
    inset: 0;
    z-index: 24;
    pointer-events: none;
    background: radial-gradient(ellipse 75% 65% at 50% 50%, transparent 45%, rgba(0,0,0,0.75) 100%);
  }

  /* ===== BACKGROUND GLOW ===== */
  .bg-glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 60% 50% at 50% 58%, #241238 0%, #030305 70%);
    animation: bgPulse 4s 4s ease-in-out infinite alternate;
    opacity: 0;
    animation-fill-mode: both;
  }
  @keyframes bgPulse {
    0%   { opacity: 0; }
    30%  { opacity: 1; }
    100% { opacity: 0.7; }
  }

  /* ===== ATMOSPHERIC DUST / FOG DRIFT ===== */
  .fog {
    position: absolute;
    left: -20%; top: 40%;
    width: 140%; height: 60%;
    background: radial-gradient(ellipse 50% 100% at 50% 50%, rgba(180,140,255,0.05), transparent 70%);
    animation: fogDrift 14s ease-in-out infinite alternate;
    filter: blur(6px);
  }
  @keyframes fogDrift {
    0%   { transform: translateX(-4%) scaleX(1); }
    100% { transform: translateX(4%) scaleX(1.06); }
  }

  /* ===== LENS FLARE SWEEP ===== */
  .flare-sweep {
    position: absolute;
    top: 0; left: -30%;
    width: 60%; height: 100%;
    background: linear-gradient(100deg, transparent 30%, rgba(255,240,200,0.18) 48%, rgba(255,255,255,0.35) 50%, rgba(255,240,200,0.18) 52%, transparent 70%);
    z-index: 22;
    animation: flareSweep 1.4s 4.05s ease-out both;
    pointer-events: none;
  }
  @keyframes flareSweep {
    0%   { left: -40%; opacity: 0; }
    15%  { opacity: 1; }
    60%  { opacity: 0.5; }
    100% { left: 120%; opacity: 0; }
  }

  .flare-dot {
    position: absolute;
    left: 50%; top: 52%;
    border-radius: 50%;
    pointer-events: none;
    z-index: 21;
    background: radial-gradient(circle, rgba(255,235,180,0.9), transparent 70%);
    animation: flarePulse 3s 5s ease-in-out infinite alternate;
  }
  @keyframes flarePulse {
    0%   { opacity: 0.5; }
    100% { opacity: 0.9; }
  }

  /* STARS */
  .star {
    position: absolute;
    border-radius: 50%;
    background: #fff;
    animation: twinkle var(--dur, 2s) var(--delay, 0s) ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    0%   { opacity: var(--lo, 0.1); transform: scale(1); }
    100% { opacity: var(--hi, 0.9); transform: scale(1.4); }
  }

  /* SPARKLE PARTICLES */
  .sparkle {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    animation: sparkleDrift var(--sdur, 2s) var(--sdelay, 0s) cubic-bezier(.4,0,.2,1) both;
  }
  @keyframes sparkleDrift {
    0%   { transform: translate(0,0) scale(0); opacity: 0; }
    20%  { opacity: 1; }
    80%  { opacity: 0.8; }
    100% { transform: translate(var(--tx,0px), var(--ty,0px)) scale(var(--sf,0.5)); opacity: 0; }
  }

  /* RADIAL BURST */
  .burst {
    position: absolute;
    left: 50%; top: 52%;
    transform: translate(-50%, -50%) scale(0);
    width: 340px; height: 340px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,215,110,0.6) 0%, rgba(150,80,10,0.15) 40%, transparent 70%);
    animation: burstIn 0.6s 3.8s cubic-bezier(.2,1.4,.4,1) both,
               burstPulse 3s 4.5s ease-in-out infinite alternate;
  }
  @keyframes burstIn  { to { transform: translate(-50%,-50%) scale(1); } }
  @keyframes burstPulse {
    0%   { opacity: 0.7; transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 1;   transform: translate(-50%,-50%) scale(1.12); }
  }

  /* STARBURST RAYS */
  .rays {
    position: absolute;
    left: 50%; top: 52%;
    transform: translate(-50%,-50%) scale(0) rotate(0deg);
    width: 360px; height: 360px;
    animation: raysFlash 0.8s 3.9s ease-out both;
    opacity: 0;
  }
  .rays svg { width: 100%; height: 100%; }
  @keyframes raysFlash {
    0%   { transform: translate(-50%,-50%) scale(0) rotate(-15deg); opacity: 0; }
    40%  { transform: translate(-50%,-50%) scale(1.1) rotate(5deg);  opacity: 1; }
    70%  { opacity: 0.6; }
    100% { transform: translate(-50%,-50%) scale(1) rotate(0deg);    opacity: 0; }
  }

  /* CAKE */
  .cake-wrap {
    position: absolute;
    left: 50%; top: 52%;
    transform: translate(-50%, -50%) scale(0);
    animation: cakeReveal 0.7s 4s cubic-bezier(.2,1.5,.4,1) both,
               cakePulse 2.5s 5s ease-in-out infinite alternate;
    transform-origin: center bottom;
    width: 200px;
    filter: drop-shadow(0 10px 18px rgba(0,0,0,0.6));
  }
  @keyframes cakeReveal {
    0%   { transform: translate(-50%,-50%) scale(0) translateY(20px); opacity: 0; }
    100% { transform: translate(-50%,-50%) scale(1) translateY(0);    opacity: 1; }
  }
  @keyframes cakePulse {
    0%   { filter: drop-shadow(0 0 14px rgba(255,190,50,0.6)) drop-shadow(0 10px 18px rgba(0,0,0,0.6)); transform: translate(-50%,-50%) scale(1); }
    100% { filter: drop-shadow(0 0 30px rgba(255,215,80,1)) drop-shadow(0 10px 18px rgba(0,0,0,0.6));   transform: translate(-50%,-50%) scale(1.04); }
  }

  /* candle flames */
  .flame {
    transform-origin: 50% 100%;
    animation: flicker 0.25s ease-in-out infinite alternate;
  }
  .flame:nth-child(2) { animation-delay: 0.07s; }
  .flame:nth-child(3) { animation-delay: 0.14s; }
  .flame:nth-child(4) { animation-delay: 0.04s; }
  .flame:nth-child(5) { animation-delay: 0.11s; }
  @keyframes flicker {
    0%   { transform: scaleX(1)   scaleY(1)    skewX(0deg); }
    100% { transform: scaleX(0.8) scaleY(1.15) skewX(5deg); }
  }

  /* CONFETTI */
  .confetti {
    position: absolute;
    top: -20px;
    pointer-events: none;
    animation: confettiFall var(--cdur, 4s) var(--cdelay, 0s) linear both;
  }
  @keyframes confettiFall {
    0%   { transform: translateY(0) rotate(0deg) translateX(0); opacity: 1; }
    80%  { opacity: 1; }
    100% { transform: translateY(110vh) rotate(var(--crot,720deg)) translateX(var(--cwobble,20px)); opacity: 0; }
  }

  /* RIBBONS */
  .ribbon-left {
    position: absolute;
    left: -80px; top: 55%;
    width: 80px; height: 8px;
    border-radius: 4px;
    background: linear-gradient(90deg, transparent, #ff69b4, #ff1493);
    animation: ribbonLeft 0.6s 7.2s cubic-bezier(.2,1.4,.4,1) both;
  }
  .ribbon-right {
    position: absolute;
    right: -80px; top: 58%;
    width: 80px; height: 8px;
    border-radius: 4px;
    background: linear-gradient(270deg, transparent, #00cfff, #0080ff);
    animation: ribbonRight 0.6s 7.2s cubic-bezier(.2,1.4,.4,1) both;
  }
  @keyframes ribbonLeft  { to { left: 20px; } }
  @keyframes ribbonRight { to { right: 20px; } }
  .ribbon-left::before, .ribbon-right::before {
    content: '';
    position: absolute;
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 3px solid;
    top: -5px;
  }
  .ribbon-left::before  { right: -4px; border-color: #ff69b4; }
  .ribbon-right::before { left: -4px;  border-color: #00cfff; }

  /* TITLE — cinematic title-card style */
  .title-wrap {
    position: absolute;
    left: 50%; top: 18%;
    transform: translate(-50%, -50%) scale(0.85);
    text-align: center;
    white-space: nowrap;
    opacity: 0;
    animation: titleReveal 2.2s 9.6s cubic-bezier(.16,.9,.25,1) both,
               titleGlowPulse 2.6s 12s ease-in-out infinite alternate;
    width: 92%;
    z-index: 28;
  }
  .title-line {
    display: block;
    font-size: clamp(28px, 10vw, 42px);
    font-weight: 800;
    letter-spacing: 0.5em;
    text-indent: 0.5em;
    background: linear-gradient(135deg, #fff6dc 0%, #ffd77a 35%, #e8a13a 65%, #fff6dc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.3;
    filter: drop-shadow(0 0 14px rgba(255,200,90,0.65));
  }
  @keyframes titleReveal {
    0%   { opacity: 0; letter-spacing: 0.9em; transform: translate(-50%,-50%) scale(0.9); filter: blur(6px); }
    55%  { opacity: 1; }
    100% { opacity: 1; letter-spacing: 0.05em; transform: translate(-50%,-50%) scale(1); filter: blur(0); }
  }
  .title-line:nth-child(2) { animation: none; }
  @keyframes titleGlowPulse {
    0%   { filter: drop-shadow(0 0 8px rgba(255,190,80,0.4)); }
    100% { filter: drop-shadow(0 0 22px rgba(255,210,110,0.9)); }
  }

  /* thin gold rule lines flanking title, classic cinematic credit style */
  .title-rule {
    display: inline-block;
    width: 26px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #e8b95c, transparent);
    vertical-align: middle;
    margin: 0 8px;
    opacity: 0.8;
  }

  /* SUBTITLE */
  .subtitle {
    position: absolute;
    left: 50%; top: 31%;
    transform: translateX(-50%);
    font-size: clamp(13px, 4vw, 17px);
    color: #e9d3a0;
    letter-spacing: 0.32em;
    text-indent: 0.32em;
    opacity: 0;
    animation: subtitleFade 1.6s 11.6s ease both;
    text-align: center;
    width: 90%;
    font-weight: 400;
    text-transform: uppercase;
    text-shadow: 0 0 10px rgba(255,210,100,0.5);
    z-index: 28;
  }
  @keyframes subtitleFade {
    0%   { opacity: 0; transform: translateX(-50%) translateY(10px); }
    100% { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  /* ===== CONTROLS (floating over fullscreen scene) ===== */
  #controls {
    position: fixed;
    left: 0; right: 0;
    bottom: max(3.5%, 18px);
    display: flex;
    justify-content: center;
    z-index: 50;
    pointer-events: none;
  }
  #controls button {
    pointer-events: auto;
    background: linear-gradient(135deg, rgba(58,43,14,0.85), rgba(107,77,21,0.85));
    backdrop-filter: blur(4px);
    border: 1px solid #a97e2f;
    color: #f1d68f;
    padding: 10px 28px;
    border-radius: 3px;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 0 14px rgba(180,130,40,0.25), inset 0 1px 0 rgba(255,255,255,0.08);
    transition: box-shadow 0.2s ease, transform 0.15s ease;
  }
  #controls button:hover {
    box-shadow: 0 0 20px rgba(220,170,70,0.5), inset 0 1px 0 rgba(255,255,255,0.15);
    transform: translateY(-1px);
  }
  #controls button:active {
    transform: translateY(0);
  }
</style>
</head>
<body>

<div id="scene-wrap"></div>

<div id="controls">
  <button id="replayBtn">&#8635; Replay</button>
</div>


<script>
(function () {
  var STARS      = 80;
  var SPARKLES   = 60;
  var CONFETTI   = 70;

  function rand(a, b) { return Math.random() * (b - a) + a; }
  function pick(arr)  { return arr[Math.floor(Math.random() * arr.length)]; }

  var C_COLS = ['#ff4444','#ff9900','#ffe600','#44dd44','#00bbff','#aa44ff','#ff44bb','#ffffff','#ffd700'];
  var S_COLS = ['#ffd700','#ffe566','#ffb300','#fff4a0','#ffcc00','#ff9f00','#fffbe0'];

  function buildRays() {
    var paths = '';
    for (var i = 0; i < 16; i++) {
      var angle = (i / 16) * Math.PI * 2;
      var hue   = 40 + i * 5;
      var x2    = (180 + 170 * Math.cos(angle)).toFixed(1);
      var y2    = (180 + 170 * Math.sin(angle)).toFixed(1);
      var w     = rand(1.5, 3.5).toFixed(1);
      paths += '<line x1="180" y1="180" x2="' + x2 + '" y2="' + y2 +
               '" stroke="hsl(' + hue + ',100%,70%)" stroke-width="' + w +
               '" stroke-linecap="round" opacity="0.85"/>';
    }
    return '<svg viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg">' + paths + '</svg>';
  }

  function buildScene() {
    var scene = document.createElement('div');
    scene.className = 'scene';

    // letterbox bars (on top, outside the camera-drift layer, so they stay fixed)
    var lbTop = document.createElement('div'); lbTop.className = 'letterbox-top'; scene.appendChild(lbTop);
    var lbBottom = document.createElement('div'); lbBottom.className = 'letterbox-bottom'; scene.appendChild(lbBottom);

    // vignette + grain (fixed overlays)
    var vig = document.createElement('div'); vig.className = 'vignette'; scene.appendChild(vig);
    var grain = document.createElement('div'); grain.className = 'grain'; scene.appendChild(grain);

    // lens flare sweep + glow
    var flareSweep = document.createElement('div'); flareSweep.className = 'flare-sweep'; scene.appendChild(flareSweep);
    var flareDot = document.createElement('div');
    flareDot.className = 'flare-dot';
    var fdsz = 120;
    flareDot.style.cssText = 'width:' + fdsz + 'px;height:' + fdsz + 'px;transform:translate(-50%,-50%);filter:blur(10px);';
    scene.appendChild(flareDot);

    // camera-drift wrapper holds all the "world" content
    var camera = document.createElement('div');
    camera.className = 'camera';
    scene.appendChild(camera);

    // bg glow
    var bg = document.createElement('div');
    bg.className = 'bg-glow';
    camera.appendChild(bg);

    // fog
    var fog = document.createElement('div');
    fog.className = 'fog';
    camera.appendChild(fog);

    // stars
    for (var i = 0; i < STARS; i++) {
      var s    = document.createElement('div');
      s.className = 'star';
      var sz   = rand(1, 3.5);
      s.style.cssText = 'width:' + sz + 'px;height:' + sz + 'px;' +
        'left:' + rand(1,99) + '%;top:' + rand(1,99) + '%;' +
        '--lo:' + rand(0.05,0.3) + ';--hi:' + rand(0.5,1) + ';' +
        '--dur:' + rand(1,3.5) + 's;--delay:' + rand(0,3) + 's;';
      camera.appendChild(s);
    }

    // sparkles
    for (var j = 0; j < SPARKLES; j++) {
      var p    = document.createElement('div');
      p.className = 'sparkle';
      var psz  = rand(3, 8);
      var sx   = rand(0, 100);
      var sy   = rand(0, 100);
      var tx   = (50 - sx) * rand(0.5, 1.2);
      var ty   = (52 - sy) * rand(0.5, 1.2);
      var col  = pick(S_COLS);
      p.style.cssText = 'width:' + psz + 'px;height:' + psz + 'px;' +
        'left:' + sx + '%;top:' + sy + '%;' +
        'background:' + col + ';' +
        'box-shadow:0 0 ' + (psz * 2) + 'px ' + col + ';' +
        '--tx:' + tx.toFixed(1) + 'vmin;--ty:' + ty.toFixed(1) + 'vmin;' +
        '--sf:' + rand(0.2,0.8) + ';' +
        '--sdur:' + rand(1.2,2.2) + 's;--sdelay:' + rand(2,4) + 's;';
      camera.appendChild(p);
    }

    // burst
    var burst = document.createElement('div');
    burst.className = 'burst';
    camera.appendChild(burst);

    // rays
    var rays = document.createElement('div');
    rays.className = 'rays';
    rays.innerHTML = buildRays();
    camera.appendChild(rays);

    // cake
    var cakeWrap = document.createElement('div');
    cakeWrap.className = 'cake-wrap';
    cakeWrap.innerHTML = [
      '<svg viewBox="0 0 200 230" xmlns="http://www.w3.org/2000/svg" width="200">',
      /* pedestal */
      '<rect x="30" y="210" width="140" height="14" rx="7" fill="#7a5200"/>',
      '<rect x="44" y="204" width="112" height="8"  rx="4" fill="#a07030"/>',
      /* tier 3 */
      '<rect x="20" y="160" width="160" height="50" rx="10" fill="#c87137"/>',
      '<rect x="20" y="160" width="160" height="14" rx="7"  fill="#e8945a"/>',
      '<circle cx="55"  cy="185" r="5" fill="#ffd700"/>',
      '<circle cx="85"  cy="185" r="5" fill="#ff69b4"/>',
      '<circle cx="115" cy="185" r="5" fill="#00cfff"/>',
      '<circle cx="145" cy="185" r="5" fill="#ffd700"/>',
      '<ellipse cx="50"  cy="160" rx="8" ry="5" fill="#fff5e0"/>',
      '<ellipse cx="80"  cy="160" rx="8" ry="5" fill="#fff5e0"/>',
      '<ellipse cx="110" cy="160" rx="8" ry="5" fill="#fff5e0"/>',
      '<ellipse cx="140" cy="160" rx="8" ry="5" fill="#fff5e0"/>',
      /* tier 2 */
      '<rect x="40" y="112" width="120" height="52" rx="10" fill="#e88c5a"/>',
      '<rect x="40" y="112" width="120" height="14" rx="7"  fill="#ffb07a"/>',
      '<circle cx="72"  cy="138" r="5" fill="#ffd700"/>',
      '<circle cx="100" cy="138" r="5" fill="#ff69b4"/>',
      '<circle cx="128" cy="138" r="5" fill="#00cfff"/>',
      '<ellipse cx="65"  cy="112" rx="7" ry="4" fill="#fff5e0"/>',
      '<ellipse cx="90"  cy="112" rx="7" ry="4" fill="#fff5e0"/>',
      '<ellipse cx="115" cy="112" rx="7" ry="4" fill="#fff5e0"/>',
      '<ellipse cx="140" cy="112" rx="7" ry="4" fill="#fff5e0"/>',
      /* tier 1 */
      '<rect x="62" y="72" width="76" height="44" rx="10" fill="#f0a070"/>',
      '<rect x="62" y="72" width="76" height="12" rx="6"  fill="#ffc898"/>',
      '<circle cx="88"  cy="94" r="4" fill="#ffd700"/>',
      '<circle cx="113" cy="94" r="4" fill="#ff69b4"/>',
      '<ellipse cx="78"  cy="72" rx="6" ry="4" fill="#fff5e0"/>',
      '<ellipse cx="100" cy="72" rx="6" ry="4" fill="#fff5e0"/>',
      '<ellipse cx="122" cy="72" rx="6" ry="4" fill="#fff5e0"/>',
      /* candles */
      '<rect x="73"  y="48" width="8" height="26" rx="3" fill="#ff6680"/>',
      '<rect x="89"  y="44" width="8" height="30" rx="3" fill="#80aaff"/>',
      '<rect x="96"  y="46" width="8" height="28" rx="3" fill="#ffe066"/>',
      '<rect x="112" y="44" width="8" height="30" rx="3" fill="#80ff99"/>',
      '<rect x="120" y="48" width="8" height="26" rx="3" fill="#ff9955"/>',
      /* flames */
      '<ellipse class="flame" cx="77"  cy="44" rx="4.5" ry="7" fill="#ffdd44" opacity="0.95"/>',
      '<ellipse class="flame" cx="93"  cy="40" rx="4.5" ry="7" fill="#ff9900" opacity="0.95"/>',
      '<ellipse class="flame" cx="100" cy="42" rx="4.5" ry="7" fill="#ffdd44" opacity="0.95"/>',
      '<ellipse class="flame" cx="116" cy="40" rx="4.5" ry="7" fill="#ff6633" opacity="0.95"/>',
      '<ellipse class="flame" cx="124" cy="44" rx="4.5" ry="7" fill="#ffdd44" opacity="0.95"/>',
      /* flame highlights */
      '<ellipse cx="77"  cy="46" rx="2" ry="3.5" fill="#fff7aa" opacity="0.7"/>',
      '<ellipse cx="93"  cy="42" rx="2" ry="3.5" fill="#fff7aa" opacity="0.7"/>',
      '<ellipse cx="100" cy="44" rx="2" ry="3.5" fill="#fff7aa" opacity="0.7"/>',
      '<ellipse cx="116" cy="42" rx="2" ry="3.5" fill="#fff7aa" opacity="0.7"/>',
      '<ellipse cx="124" cy="46" rx="2" ry="3.5" fill="#fff7aa" opacity="0.7"/>',
      '</svg>'
    ].join('');
    camera.appendChild(cakeWrap);

    // ribbons
    var rl = document.createElement('div'); rl.className = 'ribbon-left';  camera.appendChild(rl);
    var rr = document.createElement('div'); rr.className = 'ribbon-right'; camera.appendChild(rr);

    // confetti
    for (var k = 0; k < CONFETTI; k++) {
      var c     = document.createElement('div');
      c.className = 'confetti';
      var csz   = rand(6, 14);
      var isRect = Math.random() > 0.5;
      var ccol  = pick(C_COLS);
      var dur   = rand(3.5, 6);
      var delay = rand(7, 14.5);
      var wobble = (Math.random() > 0.5 ? 1 : -1) * rand(15, 60);
      var rot   = (Math.random() > 0.5 ? 1 : -1) * rand(360, 1080);
      c.style.cssText = 'left:' + rand(0,100) + '%;' +
        'width:' + csz + 'px;' +
        'height:' + (isRect ? (csz * 0.45) : csz) + 'px;' +
        'background:' + ccol + ';' +
        'border-radius:' + (isRect ? '2px' : '50%') + ';' +
        '--cdur:' + dur + 's;--cdelay:' + delay + 's;' +
        '--crot:' + rot + 'deg;--cwobble:' + wobble + 'px;' +
        'box-shadow:0 0 4px ' + ccol + '88;';
      camera.appendChild(c);
    }

    // title (stays outside camera drift, on top, fixed/stable like real film credits)
    var titleWrap = document.createElement('div');
    titleWrap.className = 'title-wrap';
    titleWrap.innerHTML =
      '<span class="title-line"><span class="title-rule"></span>HAPPY<span class="title-rule"></span></span>' +
      '<span class="title-line">BIRTHDAY</span>';
    scene.appendChild(titleWrap);

    // subtitle — decorative, no name
    var sub = document.createElement('div');
    sub.className = 'subtitle';
    sub.textContent = '✦  Wishing You Joy  ✦';
    scene.appendChild(sub);

    return scene;
  }

  function mountScene() {
    var wrap = document.getElementById('scene-wrap');
    while (wrap.firstChild) { wrap.removeChild(wrap.firstChild); }
    wrap.appendChild(buildScene());
    if (window._loopTimer) { clearTimeout(window._loopTimer); }
    window._loopTimer = setTimeout(mountScene, 15300);
  }

  document.getElementById('replayBtn').addEventListener('click', function () {
    if (window._loopTimer) { clearTimeout(window._loopTimer); }
    mountScene();
  });

  mountScene();
}());
</script>
</body>
</html>
